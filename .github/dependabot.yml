---
# Keeps this repo's SHA-pinned GitHub Actions both fixed (see the "# vX.Y.Z"
# comment next to every "uses:" line) and fresh: Dependabot resolves the new
# release's SHA and updates that comment together, so a PR from it never
# leaves the two out of sync the way lint.yml's actions/checkout drifted from
# ci.yml/release.yml (#29).
#
# No "docker" entry yet: the Dockerfile's "FROM debian:bookworm-slim" isn't
# pinned by digest, so there is nothing for that ecosystem to track. Add one
# once #27 (pin the Docker toolchain for reproducible renders) lands.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

# EOF
