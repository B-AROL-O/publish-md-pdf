---
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    name: Build & publish image to GHCR
    runs-on: ubuntu-latest
    permissions:
      # write, not read: the last step moves the major git tag (see below).
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t smoke-test .

      - name: Smoke test - render sample.md
        run: |
          docker run --rm -v "$PWD:/workspace" smoke-test sample.md
          test -s sample.pdf
          rm -f sample.pdf

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          major="${version%%.*}"
          full="ghcr.io/b-arol-o/publish-md-pdf:${GITHUB_REF_NAME}"

          echo "major_tag=v${major}" >>"$GITHUB_OUTPUT"

          # A prerelease (v2.5.0-rc1) still matches this workflow's "v*.*.*"
          # trigger -- that's a glob, not a regular expression, so the trailing
          # "*" swallows "-rc1" -- but it must not move the major git tag (below)
          # or the moving :v<major>/:latest image tags (in "tags" just below):
          # either would repoint something users pin to at a release candidate
          # (#33), the same "not coherent" drift #25's fix was written to avoid
          # for the git tag specifically.
          case "$version" in
          *-*) move_major=false ;;
          *) move_major=true ;;
          esac
          echo "move_major=$move_major" >>"$GITHUB_OUTPUT"

          {
            echo "tags<<TAGS_EOF"
            echo "$full"
            if [ "$move_major" = "true" ]; then
              echo "ghcr.io/b-arol-o/publish-md-pdf:v${major}"
              echo "ghcr.io/b-arol-o/publish-md-pdf:latest"
            fi
            echo "TAGS_EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Build & push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      # The image's :v<major> tag moves on every release, but "uses:
      # B-AROL-O/publish-md-pdf@v<major>" resolves action.yml from the *git* ref,
      # not from the image. Leaving the git tag behind is how @v2 spent four
      # releases serving an action.yml with no "attachments" input, silently
      # ignoring it for anyone who followed the README (#25). Moving it here, and
      # only after the push above succeeded, keeps the two in lockstep.
      #
      # The REST API rather than "git push --force": checkout runs with
      # persist-credentials false, so the worktree has no pushable credentials,
      # and this needs none.
      - name: Move the major git tag to this release
        if: steps.tags.outputs.move_major == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAJOR_TAG: ${{ steps.tags.outputs.major_tag }}
        run: |
          if gh api --silent "repos/$GITHUB_REPOSITORY/git/refs/tags/$MAJOR_TAG" 2>/dev/null; then
            gh api --silent -X PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$MAJOR_TAG" \
              -f sha="$GITHUB_SHA" -F force=true
          else
            # First release of a new major line: the tag doesn't exist yet.
            gh api --silent -X POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$MAJOR_TAG" -f sha="$GITHUB_SHA"
          fi
          echo "INFO: git tag $MAJOR_TAG now points at $GITHUB_SHA"

# EOF
