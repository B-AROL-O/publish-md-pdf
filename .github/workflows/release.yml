---
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    name: Build & publish image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t smoke-test .

      - name: Smoke test - render sample.md
        run: |
          docker run --rm -v "$PWD:/workspace" smoke-test sample.md
          test -s sample.pdf
          rm -f sample.pdf

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          major="${version%%.*}"
          {
            echo "full=ghcr.io/b-arol-o/publish-md-pdf:${GITHUB_REF_NAME}"
            echo "major=ghcr.io/b-arol-o/publish-md-pdf:v${major}"
            echo "latest=ghcr.io/b-arol-o/publish-md-pdf:latest"
          } >>"$GITHUB_OUTPUT"

      - name: Build & push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tags.outputs.full }}
            ${{ steps.tags.outputs.major }}
            ${{ steps.tags.outputs.latest }}

# EOF
