---
name: Lint Code Base

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Lint Code Base
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint Code Base
        uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # .claude/ holds terse, machine-oriented agent notes (frontmatter + short
          # bullets), not prose documentation, so heading/terminology rules meant for
          # human-facing docs don't apply. CLAUDE.md is a symlink to AGENTS.md, whose
          # target super-linter already lints under its own name — excluding the
          # symlink avoids double-reporting the same lines under two file names.
          FILTER_REGEX_EXCLUDE: ".claude/.*|^CLAUDE.md$"

# EOF
