---
name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build image, smoke test, action self-test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Runs before anything else needs the daemon, so this stop/start bracket
      # doesn't collide with any other step in the job.
      - name: Host wrappers - detect a stopped Docker daemon
        run: |
          sudo systemctl stop docker.socket docker.service

          if scripts/publish-md-pdf.sh sample.md >bash-daemon-down.txt 2>&1; then
            echo "ERROR: bash wrapper should have failed with the daemon stopped"
            cat bash-daemon-down.txt
            exit 1
          fi
          grep -q "daemon isn't running" bash-daemon-down.txt
          rm -f bash-daemon-down.txt

          if pwsh -File scripts/publish-md-pdf.ps1 sample.md >ps-daemon-down.txt 2>&1; then
            echo "ERROR: PowerShell wrapper should have failed with the daemon stopped"
            cat ps-daemon-down.txt
            exit 1
          fi
          grep -q "daemon isn't running" ps-daemon-down.txt
          rm -f ps-daemon-down.txt

          sudo systemctl start docker.service
          ready=0
          for _ in {1..20}; do
            docker info >/dev/null 2>&1 && {
              ready=1
              break
            }
            sleep 0.5
          done
          [ "$ready" -eq 1 ] || {
            echo "ERROR: Docker daemon never came back up"
            exit 1
          }

      # Tagged to match runs.image in action.yml, so the "Action self-test"
      # steps below resolve to this locally built image instead of pulling
      # the published one.
      - name: Build image
        run: docker build -t ghcr.io/b-arol-o/publish-md-pdf:v2 .

      - name: Smoke test - render sample.md (default format)
        run: |
          docker run --rm -v "$PWD:/workspace" ghcr.io/b-arol-o/publish-md-pdf:v2 sample.md
          test -s sample.pdf
          rm -f sample.pdf

      - name: Smoke test - render sample-mermaid.md (Mermaid diagram)
        run: |
          docker run --rm -v "$PWD:/workspace" ghcr.io/b-arol-o/publish-md-pdf:v2 sample-mermaid.md
          test -s sample-mermaid.pdf

      - name: Verify Mermaid diagram was rendered as an image, not literal code
        run: |
          sudo apt-get install -y poppler-utils
          if pdftotext sample-mermaid.pdf - | grep -q "erDiagram"; then
            echo "ERROR: Mermaid diagram rendered as literal code, not an image"
            exit 1
          fi
          rm -f sample-mermaid.pdf

      - name: Smoke test - convert sample.md to/from Confluence via --format
        run: |
          docker run --rm -v "$PWD:/workspace" ghcr.io/b-arol-o/publish-md-pdf:v2 \
            --format confluence sample.md
          test -s sample.confluence

          docker run --rm -v "$PWD:/workspace" ghcr.io/b-arol-o/publish-md-pdf:v2 \
            --format md --output-name sample-roundtrip sample.confluence
          test -s sample-roundtrip.md

          rm -f sample.confluence sample-roundtrip.md

      # The two host-side wrappers under scripts/ are what a documentation repo
      # copies in; they must agree with each other and with the image's own CLI.
      # Both default to the :v2 tag built above, so these resolve locally.
      # The mkdir'd directory is outside $PWD on purpose: it forces the extra
      # bind mount, whose container path each wrapper has to translate back.
      - name: Host wrapper (bash) - convert into a directory outside $PWD
        run: |
          mkdir -p /tmp/wrapper-out
          output="$(scripts/publish-md-pdf.sh --output-dir /tmp/wrapper-out sample.md 2>&1)"
          echo "$output"
          test -s /tmp/wrapper-out/sample.pdf
          # The wrapper owns this translation; a leaked /mnt/extra-N is the bug.
          echo "$output" | grep -qF /tmp/wrapper-out/sample.pdf
          if echo "$output" | grep -q "/mnt/extra-"; then
            echo "ERROR: wrapper leaked a container path into its output"
            exit 1
          fi
          rm -rf /tmp/wrapper-out

      - name: Host wrapper (PowerShell) - same conversion, same expectations
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path /tmp/wrapper-out-ps | Out-Null
          $output = & ./scripts/publish-md-pdf.ps1 -OutputDir /tmp/wrapper-out-ps sample.md 2>&1 | Out-String
          Write-Output $output
          if (-not (Test-Path /tmp/wrapper-out-ps/sample.pdf)) { throw 'no PDF produced' }
          if (-not $output.Contains('/tmp/wrapper-out-ps/sample.pdf')) { throw 'host path not translated back' }
          if ($output -match '/mnt/extra-') { throw 'wrapper leaked a container path into its output' }
          Remove-Item -Recurse -Force /tmp/wrapper-out-ps

      # PowerShell hands a script parameter the pattern verbatim instead of
      # expanding it, so unlike the bash wrapper this one does its own globbing.
      - name: Host wrapper (PowerShell) - expands a wildcard input itself
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path /tmp/wrapper-glob | Out-Null
          & ./scripts/publish-md-pdf.ps1 -OutputDir /tmp/wrapper-glob sample*.md
          $pdfs = @(Get-ChildItem /tmp/wrapper-glob -Filter *.pdf)
          if ($pdfs.Count -ne 2) { throw "expected 2 PDFs from sample*.md, got $($pdfs.Count)" }
          # A wildcard matching several files can't share one output name.
          & ./scripts/publish-md-pdf.ps1 -OutputName one sample*.md
          if ($LASTEXITCODE -eq 0) { throw '-OutputName with a multi-file wildcard should have failed' }
          Remove-Item -Recurse -Force /tmp/wrapper-glob
          # GitHub's pwsh shell exits with the trailing $LASTEXITCODE, which the
          # deliberate failure above left at 1.
          exit 0

      - name: Host wrappers - reject --css-file with a non-pdf format
        shell: bash
        run: |
          if scripts/publish-md-pdf.sh --format confluence --css-file publish-md-pdf.css sample.md; then
            echo "ERROR: bash wrapper should have rejected --css-file with --format confluence"
            exit 1
          fi
          if pwsh -File scripts/publish-md-pdf.ps1 -Format confluence -CssFile publish-md-pdf.css sample.md; then
            echo "ERROR: PowerShell wrapper should have rejected -CssFile with -Format confluence"
            exit 1
          fi

      # Everything below exercises the "import a Confluence page by URL" feature
      # (issue #10) against a local nginx mock -- no real Confluence Cloud
      # instance or credentials involved. Both containers use --network host so
      # the tool's container can reach the mock at 127.0.0.1.
      - name: Confluence URL import - build mock fixtures
        run: |
          mkdir -p /tmp/confluence-mock
          docker run --rm -v "$PWD:/workspace" ghcr.io/b-arol-o/publish-md-pdf:v2 \
            --format confluence sample.md
          jq -n --arg body "$(cat sample.confluence)" \
            '{id: "12345", title: "Sample document", spaceId: "98765",
              body: {storage: {value: $body, representation: "storage"}},
              version: {number: 1}}' >/tmp/confluence-mock/page.json
          rm -f sample.confluence

          # A second page for the "images and attachments" tests (issue #13),
          # separate from page 12345 above so those tests can't interfere with
          # this one's attachments API / download mocks.
          jq -n --arg body "$(cat sample-attachments.confluence)" \
            '{id: "12346", title: "Sample page with attachments", spaceId: "98765",
              body: {storage: {value: $body, representation: "storage"}},
              version: {number: 1}}' >/tmp/confluence-mock/page-attachments.json

          # 1x1 PNG and a plain text file, standing in for real attachments.
          base64 -d >/tmp/confluence-mock/diagram.png <<<"iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
          cp /tmp/confluence-mock/diagram.png /tmp/confluence-mock/logo.png
          cp /tmp/confluence-mock/diagram.png /tmp/confluence-mock/evil.png
          printf 'the specification text\n' >/tmp/confluence-mock/spec.txt

          # downloadLink is shaped like a real Confluence Cloud v1 REST path
          # (verified against a live site): relative to the "/wiki" base, not
          # the bare origin, and it 302s to the actual file rather than
          # serving it directly -- both of which the mock below now exercises,
          # since an earlier, invented shape here let a "join with origin,
          # don't follow the redirect" bug in lib/fetch-confluence.sh ship
          # without either being caught. The fifth entry's downloadLink points
          # off-mock -- see "attachment download refuses a cross-origin link"
          # below, which asserts it's never fetched even though nothing serves
          # it. The fourth entry's title is a directory traversal attempt --
          # see "attachment download sanitizes a hostile filename".
          jq -n '{results: [
              {id: "att1", title: "diagram.png",
               downloadLink: "/rest/api/content/12346/child/attachment/att1/download"},
              {id: "att2", title: "B-AROL-O logo.png",
               downloadLink: "/rest/api/content/12346/child/attachment/att2/download"},
              {id: "att3", title: "specification.txt",
               downloadLink: "/rest/api/content/12346/child/attachment/att3/download"},
              {id: "att4", title: "../../evil.png",
               downloadLink: "/rest/api/content/12346/child/attachment/att4/download"},
              {id: "att5", title: "exfil.png",
               downloadLink: "https://attacker.example.invalid/steal.png"}
            ]}' >/tmp/confluence-mock/attachments.json

          htpasswd_hash="$(openssl passwd -apr1 mocktoken)"
          printf 'mockuser@example.com:%s\n' "$htpasswd_hash" >/tmp/confluence-mock/htpasswd

          cat >/tmp/confluence-mock/nginx.conf <<'NGINX_EOF'
          server {
              listen 18085;

              location = /wiki/x/AYAJ4 {
                  auth_basic "Confluence Mock";
                  auth_basic_user_file /etc/nginx/htpasswd;
                  return 302 /wiki/spaces/DEV/pages/12345/Sample+Page;
              }

              location = /wiki/spaces/DEV/pages/12345/Sample+Page {
                  auth_basic "Confluence Mock";
                  auth_basic_user_file /etc/nginx/htpasswd;
                  return 200 "mock page view\n";
              }

              location = /wiki/api/v2/pages/12345 {
                  auth_basic "Confluence Mock";
                  auth_basic_user_file /etc/nginx/htpasswd;
                  default_type application/json;
                  alias /usr/share/nginx/html/page.json;
              }

              location = /wiki/api/v2/pages/12346 {
                  auth_basic "Confluence Mock";
                  auth_basic_user_file /etc/nginx/htpasswd;
                  default_type application/json;
                  alias /usr/share/nginx/html/page-attachments.json;
              }

              location = /wiki/api/v2/pages/12346/attachments {
                  auth_basic "Confluence Mock";
                  auth_basic_user_file /etc/nginx/htpasswd;
                  default_type application/json;
                  alias /usr/share/nginx/html/attachments.json;
              }

              location ~ ^/download/attachments/12346/(diagram\.png|logo\.png|spec\.txt|evil\.png)$ {
                  auth_basic "Confluence Mock";
                  auth_basic_user_file /etc/nginx/htpasswd;
                  alias /usr/share/nginx/html/$1;
              }

              # The v1 downloadLink shape: a 302 to the file above, not the
              # file itself -- see the comment on attachments.json.
              location = /wiki/rest/api/content/12346/child/attachment/att1/download {
                  auth_basic "Confluence Mock";
                  auth_basic_user_file /etc/nginx/htpasswd;
                  return 302 /download/attachments/12346/diagram.png?version=1;
              }

              location = /wiki/rest/api/content/12346/child/attachment/att2/download {
                  auth_basic "Confluence Mock";
                  auth_basic_user_file /etc/nginx/htpasswd;
                  return 302 /download/attachments/12346/logo.png?version=1;
              }

              location = /wiki/rest/api/content/12346/child/attachment/att3/download {
                  auth_basic "Confluence Mock";
                  auth_basic_user_file /etc/nginx/htpasswd;
                  return 302 /download/attachments/12346/spec.txt?version=1;
              }

              location = /wiki/rest/api/content/12346/child/attachment/att4/download {
                  auth_basic "Confluence Mock";
                  auth_basic_user_file /etc/nginx/htpasswd;
                  return 302 /download/attachments/12346/evil.png?version=1;
              }

              location / {
                  return 404;
              }
          }
          NGINX_EOF

      - name: Confluence URL import - start mock server
        run: |
          docker run -d --name confluence-mock --network host \
            -v /tmp/confluence-mock/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
            -v /tmp/confluence-mock/htpasswd:/etc/nginx/htpasswd:ro \
            -v /tmp/confluence-mock/page.json:/usr/share/nginx/html/page.json:ro \
            -v /tmp/confluence-mock/page-attachments.json:/usr/share/nginx/html/page-attachments.json:ro \
            -v /tmp/confluence-mock/attachments.json:/usr/share/nginx/html/attachments.json:ro \
            -v /tmp/confluence-mock/diagram.png:/usr/share/nginx/html/diagram.png:ro \
            -v /tmp/confluence-mock/logo.png:/usr/share/nginx/html/logo.png:ro \
            -v /tmp/confluence-mock/spec.txt:/usr/share/nginx/html/spec.txt:ro \
            -v /tmp/confluence-mock/evil.png:/usr/share/nginx/html/evil.png:ro \
            nginx:alpine

          code="000"
          for _ in {1..20}; do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18085/ || true)"
            [ "$code" != "000" ] && break
            sleep 0.5
          done
          [ "$code" != "000" ] || {
            echo "ERROR: mock server never came up"
            docker logs confluence-mock
            exit 1
          }

      - name: Confluence URL import - tiny link, default format (md)
        run: |
          docker run --rm --network host \
            -e CONFLUENCE_EMAIL=mockuser@example.com \
            -e CONFLUENCE_API_TOKEN=mocktoken \
            -e PUBLISH_MD_PDF_ALLOW_INSECURE=1 \
            -v "$PWD:/workspace" ghcr.io/b-arol-o/publish-md-pdf:v2 \
            http://127.0.0.1:18085/wiki/x/AYAJ4
          test -s sample-document.md
          grep -q '^title: "Sample document"$' sample-document.md
          rm -f sample-document.md

      - name: Confluence URL import - --format pdf bridges through md
        run: |
          docker run --rm --network host \
            -e CONFLUENCE_EMAIL=mockuser@example.com \
            -e CONFLUENCE_API_TOKEN=mocktoken \
            -e PUBLISH_MD_PDF_ALLOW_INSECURE=1 \
            -v "$PWD:/workspace" ghcr.io/b-arol-o/publish-md-pdf:v2 \
            --format pdf http://127.0.0.1:18085/wiki/x/AYAJ4
          test -s sample-document.pdf
          rm -f sample-document.pdf

      - name: Confluence URL import - --format confluence is byte-identical to the source
        run: |
          docker run --rm --network host \
            -e CONFLUENCE_EMAIL=mockuser@example.com \
            -e CONFLUENCE_API_TOKEN=mocktoken \
            -e PUBLISH_MD_PDF_ALLOW_INSECURE=1 \
            -v "$PWD:/workspace" ghcr.io/b-arol-o/publish-md-pdf:v2 \
            --format confluence http://127.0.0.1:18085/wiki/x/AYAJ4

          docker run --rm -v "$PWD:/workspace" ghcr.io/b-arol-o/publish-md-pdf:v2 \
            --format confluence --output-name sample-fixture sample.md

          diff sample-document.confluence sample-fixture.confluence
          rm -f sample-document.confluence sample-fixture.confluence

      - name: Confluence URL import - direct /pages/<id> URL (no redirect)
        run: |
          docker run --rm --network host \
            -e CONFLUENCE_EMAIL=mockuser@example.com \
            -e CONFLUENCE_API_TOKEN=mocktoken \
            -e PUBLISH_MD_PDF_ALLOW_INSECURE=1 \
            -v "$PWD:/workspace" ghcr.io/b-arol-o/publish-md-pdf:v2 \
            --output-name direct-test \
            http://127.0.0.1:18085/wiki/spaces/DEV/pages/12345/Sample+Page
          test -s direct-test.md
          rm -f direct-test.md

      # Everything below exercises issue #13: images and other attachments on
      # an imported page, against the page-12346 fixtures set up above.
      - name: Confluence URL import - --format md downloads and resolves attachments
        run: |
          docker run --rm --network host \
            -e CONFLUENCE_EMAIL=mockuser@example.com \
            -e CONFLUENCE_API_TOKEN=mocktoken \
            -e PUBLISH_MD_PDF_ALLOW_INSECURE=1 \
            -v "$PWD:/workspace" ghcr.io/b-arol-o/publish-md-pdf:v2 \
            --format md --output-name page \
            http://127.0.0.1:18085/wiki/spaces/DEV/pages/12346/Sample+Attachments

          test -s page-attachments/diagram.png
          test -s page-attachments/specification.txt
          diff page-attachments/diagram.png /tmp/confluence-mock/diagram.png

          grep -q '!\[diagram.png\](page-attachments/diagram.png)' page.md
          grep -q '\[the specification\](page-attachments/specification.txt)' page.md
          # The captioned image's caption survived as its own visible
          # paragraph, not only as invisible alt text. The <span> tags stay
          # literal HTML (gfm has no Markdown syntax for a class attribute),
          # but the caption's own markup inside it becomes plain gfm (**bold**,
          # not <strong>), like everywhere else in this Markdown output.
          grep -q '<span class="image-caption">Figure 1: the \*\*project\*\* logo.</span>' page.md
          # ri:url images are left pointing at the remote host, not downloaded.
          grep -q '!\[\](https://www.gnu.org/graphics/gplv3-127x51.png)' page.md
          # An <ac:image> quoted inside a code sample is not an image and must
          # survive as written, not be rewritten or have its attachment resolved.
          grep -q '<ri:attachment ri:filename="not-really-an-image.png" />' page.md

      - name: Confluence URL import - attachment download sanitizes a hostile filename
        run: |
          # The API reported a "../../evil.png" title; the file it downloaded to
          # must be confined to page-attachments/ and never escape it.
          test -s page-attachments/evil.png
          test ! -e evil.png
          test ! -e ../evil.png
          # sudo: page-attachments/ was created by the container, which runs
          # as root (see Dockerfile), so the runner's own non-root user can't
          # remove files inside it without elevating.
          sudo rm -rf page-attachments page.md

      - name: Confluence URL import - attachment download refuses a cross-origin link
        run: |
          # The fifth attachment's downloadLink pointed at
          # attacker.example.invalid; it must be skipped with a warning, and
          # (since that host doesn't resolve) its absence proves no request
          # to it was ever attempted, credentialed or not.
          docker run --rm --network host \
            -e CONFLUENCE_EMAIL=mockuser@example.com \
            -e CONFLUENCE_API_TOKEN=mocktoken \
            -e PUBLISH_MD_PDF_ALLOW_INSECURE=1 \
            -v "$PWD:/workspace" ghcr.io/b-arol-o/publish-md-pdf:v2 \
            --format md --output-name page \
            http://127.0.0.1:18085/wiki/spaces/DEV/pages/12346/Sample+Attachments 2>cross-origin.txt
          grep -q "skipping attachment 'exfil.png': its download link points outside" cross-origin.txt
          test ! -e page-attachments/exfil.png
          sudo rm -rf page-attachments page.md cross-origin.txt

      - name: Confluence URL import - --format confluence does not download attachments
        run: |
          # Re-uploading a saved .confluence file to Confluence needs it to
          # still reference attachments by name, not by a local path, so this
          # format is the one exception that does not download anything.
          docker run --rm --network host \
            -e CONFLUENCE_EMAIL=mockuser@example.com \
            -e CONFLUENCE_API_TOKEN=mocktoken \
            -e PUBLISH_MD_PDF_ALLOW_INSECURE=1 \
            -v "$PWD:/workspace" ghcr.io/b-arol-o/publish-md-pdf:v2 \
            --format confluence --output-name page \
            http://127.0.0.1:18085/wiki/spaces/DEV/pages/12346/Sample+Attachments
          test -s page.confluence
          test ! -d page-attachments
          grep -q 'ri:filename="diagram.png"' page.confluence
          rm -f page.confluence

      - name: Confluence URL import - --format pdf embeds images, --no-attachments does not fetch them
        run: |
          docker run --rm --network host \
            -e CONFLUENCE_EMAIL=mockuser@example.com \
            -e CONFLUENCE_API_TOKEN=mocktoken \
            -e PUBLISH_MD_PDF_ALLOW_INSECURE=1 \
            -v "$PWD:/workspace" ghcr.io/b-arol-o/publish-md-pdf:v2 \
            --format pdf --output-name page \
            http://127.0.0.1:18085/wiki/spaces/DEV/pages/12346/Sample+Attachments
          test -s page.pdf
          # The temp directory attachments were downloaded into on the way to
          # rendering is gone; nothing was left behind in the workspace.
          test ! -d page-attachments
          sudo apt-get install -y poppler-utils
          [ "$(pdfimages -list page.pdf | tail -n +3 | wc -l)" -ge 1 ] || {
            echo "ERROR: expected at least one embedded image in page.pdf"
            exit 1
          }
          rm -f page.pdf

          docker run --rm --network host \
            -e CONFLUENCE_EMAIL=mockuser@example.com \
            -e CONFLUENCE_API_TOKEN=mocktoken \
            -e PUBLISH_MD_PDF_ALLOW_INSECURE=1 \
            -v "$PWD:/workspace" ghcr.io/b-arol-o/publish-md-pdf:v2 \
            --format md --no-attachments --output-name page \
            http://127.0.0.1:18085/wiki/spaces/DEV/pages/12346/Sample+Attachments
          test -s page.md
          test ! -d page-attachments
          # Still rewritten to a bare relative filename (unresolved, since
          # nothing was downloaded to it) rather than dropped. No alt text:
          # pandoc's gfm writer omits alt text that's identical to the
          # image's src basename, which this is without an attachments
          # directory prefixing it -- verified directly against pandoc.
          grep -q '!\[\](diagram.png)' page.md
          rm -f page.md

      - name: Confluence URL import - missing credentials fails clearly
        run: |
          if docker run --rm --network host \
            -e PUBLISH_MD_PDF_ALLOW_INSECURE=1 \
            -v "$PWD:/workspace" ghcr.io/b-arol-o/publish-md-pdf:v2 \
            http://127.0.0.1:18085/wiki/x/AYAJ4 2>missing-creds.txt; then
            echo "ERROR: should have failed without credentials"
            exit 1
          fi
          grep -q "CONFLUENCE_EMAIL and CONFLUENCE_API_TOKEN" missing-creds.txt
          rm -f missing-creds.txt

      - name: Confluence URL import - server rejects bad credentials
        run: |
          if docker run --rm --network host \
            -e CONFLUENCE_EMAIL=wrong@example.com \
            -e CONFLUENCE_API_TOKEN=wrongtoken \
            -e PUBLISH_MD_PDF_ALLOW_INSECURE=1 \
            -v "$PWD:/workspace" ghcr.io/b-arol-o/publish-md-pdf:v2 \
            http://127.0.0.1:18085/wiki/x/AYAJ4 2>bad-creds.txt; then
            echo "ERROR: should have failed with bad credentials"
            exit 1
          fi
          grep -q "authentication failed" bad-creds.txt
          rm -f bad-creds.txt

      - name: Confluence URL import - refuses plain HTTP without the override
        run: |
          if docker run --rm --network host \
            -e CONFLUENCE_EMAIL=mockuser@example.com \
            -e CONFLUENCE_API_TOKEN=mocktoken \
            -v "$PWD:/workspace" ghcr.io/b-arol-o/publish-md-pdf:v2 \
            http://127.0.0.1:18085/wiki/x/AYAJ4 2>insecure.txt; then
            echo "ERROR: should have refused plain HTTP"
            exit 1
          fi
          grep -q "PUBLISH_MD_PDF_ALLOW_INSECURE" insecure.txt
          rm -f insecure.txt

      - name: Confluence URL import - unrecognized URL shape fails clearly
        run: |
          if docker run --rm --network host \
            -e CONFLUENCE_EMAIL=mockuser@example.com \
            -e CONFLUENCE_API_TOKEN=mocktoken \
            -e PUBLISH_MD_PDF_ALLOW_INSECURE=1 \
            -v "$PWD:/workspace" ghcr.io/b-arol-o/publish-md-pdf:v2 \
            http://127.0.0.1:18085/not-confluence/foo 2>bad-url.txt; then
            echo "ERROR: should have failed on an unrecognized URL"
            exit 1
          fi
          grep -q "not a recognized Confluence Cloud page URL" bad-url.txt
          rm -f bad-url.txt

      - name: Confluence URL import - stop mock server
        if: always()
        run: docker rm -f confluence-mock

      - name: Verify --css-file is rejected with a non-pdf format
        run: |
          if docker run --rm -v "$PWD:/workspace" ghcr.io/b-arol-o/publish-md-pdf:v2 \
            --format confluence --css-file publish-md-pdf.css sample.md; then
            echo "ERROR: --css-file with --format confluence should have failed"
            exit 1
          fi

      - name: Verify an unknown --format is rejected
        run: |
          if docker run --rm -v "$PWD:/workspace" ghcr.io/b-arol-o/publish-md-pdf:v2 \
            --format bogus sample.md; then
            echo "ERROR: an unknown --format should have failed"
            exit 1
          fi

      # The v1 --entrypoint invocations must keep working until v3.0.0.
      - name: Verify deprecated v1 entrypoint shims still work
        run: |
          docker run --rm -v "$PWD:/workspace" \
            --entrypoint /usr/local/bin/md-to-confluence.sh \
            ghcr.io/b-arol-o/publish-md-pdf:v2 sample.md
          test -s sample.confluence

          docker run --rm -v "$PWD:/workspace" \
            --entrypoint /usr/local/bin/confluence-to-md.sh \
            ghcr.io/b-arol-o/publish-md-pdf:v2 --output-name sample-roundtrip sample.confluence
          test -s sample-roundtrip.md

          rm -f sample.confluence sample-roundtrip.md

      - name: Verify the deprecation shims warn on stderr
        run: |
          docker run --rm -v "$PWD:/workspace" \
            --entrypoint /usr/local/bin/md-to-confluence.sh \
            ghcr.io/b-arol-o/publish-md-pdf:v2 sample.md 2>shim-stderr.txt
          grep -q "deprecated" shim-stderr.txt
          rm -f sample.confluence shim-stderr.txt

      - name: Action self-test
        uses: ./
        with:
          files: sample.md
          output-dir: .
          output-name: sample-via-action

      - name: Verify action self-test output
        run: |
          test -s sample-via-action.pdf
          rm -f sample-via-action.pdf

      - name: Action self-test - Confluence format
        uses: ./
        with:
          files: sample.md
          format: confluence
          output-dir: .
          output-name: sample-via-action

      - name: Verify action self-test Confluence output
        run: |
          test -s sample-via-action.confluence
          rm -f sample-via-action.confluence

# EOF
