---
name: Build & Test

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build image, smoke test, action self-test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t ghcr.io/b-arol-o/publish-md-pdf:v1 .

      - name: Smoke test - render sample.md
        run: |
          docker run --rm -v "$PWD:/workspace" ghcr.io/b-arol-o/publish-md-pdf:v1 sample.md
          test -s sample.pdf
          rm -f sample.pdf

      - name: Smoke test - render sample-mermaid.md (Mermaid diagram)
        run: |
          docker run --rm -v "$PWD:/workspace" ghcr.io/b-arol-o/publish-md-pdf:v1 sample-mermaid.md
          test -s sample-mermaid.pdf

      - name: Verify Mermaid diagram was rendered as an image, not literal code
        run: |
          sudo apt-get install -y poppler-utils
          if pdftotext sample-mermaid.pdf - | grep -q "erDiagram"; then
            echo "ERROR: Mermaid diagram rendered as literal code, not an image"
            exit 1
          fi
          rm -f sample-mermaid.pdf

      - name: Smoke test - convert sample.md to/from Confluence
        run: |
          docker run --rm -v "$PWD:/workspace" \
            --entrypoint /usr/local/bin/md-to-confluence.sh \
            ghcr.io/b-arol-o/publish-md-pdf:v1 sample.md
          test -s sample.confluence

          docker run --rm -v "$PWD:/workspace" \
            --entrypoint /usr/local/bin/confluence-to-md.sh \
            ghcr.io/b-arol-o/publish-md-pdf:v1 --output-name sample-roundtrip sample.confluence
          test -s sample-roundtrip.md

          rm -f sample.confluence sample-roundtrip.md

      - name: Action self-test
        uses: ./
        with:
          files: sample.md
          output-dir: .
          output-name: sample-via-action

      - name: Verify action self-test output
        run: |
          test -s sample-via-action.pdf
          rm -f sample-via-action.pdf

      - name: Action self-test - Confluence format
        uses: ./
        with:
          files: sample.md
          format: confluence
          output-dir: .
          output-name: sample-via-action

      - name: Verify action self-test Confluence output
        run: |
          test -s sample-via-action.confluence
          rm -f sample-via-action.confluence

# EOF
