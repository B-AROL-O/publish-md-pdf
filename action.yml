name: "publish-md-pdf"
description: "Render Markdown files to A4-sized PDF using pandoc + WeasyPrint"
author: "B-AROL-O Team"
branding:
  icon: "file-text"
  color: "gray-dark"

inputs:
  files:
    description: "Space-separated list of Markdown files to convert (glob-expanded by the shell)"
    required: true
  output-dir:
    description: "Directory to write the PDF(s) into (default: repo root)"
    required: false
    default: "."
  output-name:
    description: "Filename for the PDF; only valid when converting a single input file"
    required: false
    default: ""
  css-file:
    description: "Stylesheet to use (default: the action's built-in publish-md-pdf.css)"
    required: false
    default: ""

runs:
  using: "docker"
  image: "docker://ghcr.io/b-arol-o/publish-md-pdf:v1"
  entrypoint: "/usr/local/bin/entrypoint.sh"

